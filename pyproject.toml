[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ailint"
version = "0.1.0"
description = "Static analysis linter for AI/ML Python code — catch LLM anti-patterns before they ship"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jivan Biradar" }]
keywords = ["linter", "static-analysis", "llm", "ai", "ml", "openai", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ailint = "ailint.cli:cli"

[project.urls]
Homepage = "https://github.com/jivanb/AI-Lint"
Repository = "https://github.com/jivanb/AI-Lint"
Issues = "https://github.com/jivanb/AI-Lint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ailint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ailint --cov-report=term-missing"

[tool.ailint]
severity = "INFO"
exclude = [".venv", "node_modules", "__pycache__", ".git"]
